name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --draft \
              --title "$TAG_NAME" \
              --notes "Automated draft release for $TAG_NAME."
          else
            gh release create "$TAG_NAME" \
              --draft \
              --title "$TAG_NAME" \
              --notes "Automated draft release for $TAG_NAME."
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run database tests
        run: npm run test:db

      - name: Build installer
        run: npm run build

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          assets=()
          while IFS= read -r file; do
            [ -n "$file" ] && assets+=("$file")
          done < <(find release -maxdepth 2 -type f \( -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" \))

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found under release/."
            find release -maxdepth 3 -type f 2>/dev/null || true
            exit 1
          fi

          gh release upload "$TAG_NAME" "${assets[@]}" --clobber
